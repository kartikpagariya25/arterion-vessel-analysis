version: 2
updates:
  # Minor and patch updates only, grouped into one pull request per ecosystem and checked monthly.
  # Major versions (numpy 2, opencv 5, ...) can change model behaviour, so they are updated by hand.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The models are exported to ONNX and checked against this runtime; move it deliberately.
      - dependency-name: onnxruntime
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # CI and the weights are verified on Python 3.11.
      - dependency-name: python
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
