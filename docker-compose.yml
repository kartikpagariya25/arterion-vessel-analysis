services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATA_DIR=/data
      - UPLOAD_DIR=/data/uploads
      - JWT_SECRET=${JWT_SECRET:-}
      - DOCTOR_INVITE_CODE=${DOCTOR_INVITE_CODE:-}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - UPLOAD_TTL_HOURS=${UPLOAD_TTL_HOURS:-}
    volumes:
      - ./backend/app/vessel_analysis/weights:/srv/app/vessel_analysis/weights:ro
      - data:/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  data:
