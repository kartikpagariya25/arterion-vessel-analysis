services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - UPLOAD_DIR=/data/uploads
    volumes:
      - ./backend/app/vessel_analysis/weights:/srv/app/vessel_analysis/weights:ro
      - uploads:/data/uploads
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  uploads:
