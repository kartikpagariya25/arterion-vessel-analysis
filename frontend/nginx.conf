server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

  # The pages load fonts, icons and animation libraries from public CDNs, so no Content-Security-Policy is set here.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  error_page 404 /404.html;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = /404.html { internal; }
  location ~* \.(?:html|webmanifest)$ { expires -1; }
  location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ { expires 1h; }
  location / { try_files $uri $uri/ =404; }
}
